# 可选：用 Nginx 作为反向代理（域名 / HTTPS / 限流时使用）
# 放置到 /etc/nginx/conf.d/personal-chief.conf，然后 nginx -t && systemctl reload nginx
#
# 注意：使用 Nginx 时，安全组只需开放 80/443，8001 不需要对公网开放。
# SSE（打字机流式输出）必须关闭缓冲，否则内容会被 Nginx 攒着一次性发出。

limit_req_zone $binary_remote_addr zone=chief_api:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    # 前端直传 OSS，后端不接收图片，正常请求体很小
    client_max_body_size 1m;

    location / {
        # 简单限流，防止公网被脚本刷模型/搜索额度；可调大或删除
        limit_req zone=chief_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 流式输出关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
